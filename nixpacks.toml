[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_22"]

[phases.install]
cmds = [
  "composer install --ignore-platform-reqs --no-dev --no-interaction --prefer-dist --optimize-autoloader",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan package:discover --ansi",
  "php artisan view:cache"
]

[start]
cmd = "export PHP_CLI_SERVER_WORKERS=8 && php artisan migrate --force && php -d opcache.enable_cli=1 -d opcache.memory_consumption=128 -d opcache.max_accelerated_files=10000 -S 0.0.0.0:80 -t public"